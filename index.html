<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>секретная пасхалка</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0d0d0d;
      color: #f2f2f2;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      max-width: 620px;
      padding: 32px;
      border: 1px solid #2d2d2d;
      border-radius: 20px;
      background: #151515;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }
    h1 {
      margin-top: 0;
      font-size: clamp(28px, 6vw, 48px);
    }
    p {
      font-size: 18px;
      line-height: 1.5;
      opacity: .9;
    }
    a {
      display: inline-block;
      margin-top: 12px;
      padding: 14px 20px;
      border-radius: 12px;
      background: #f2f2f2;
      color: #111;
      text-decoration: none;
      font-weight: 700;
    }
    a:hover {
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>поздравляю!</h1>
    <p>ты нашёл секретную пасхалку</p>
    <p>иди на видео 👇</p>
    <a href="https://youtube.com/shorts/VaSS7awDIaw?si=3-Z02sY23gAnIXRh" target="_blank" rel="noopener noreferrer">открыть видео</a>
  </main>
</body>
</html>
