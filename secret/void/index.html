<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VOID NODE</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  background: #000;
  color: #eee;

  font-family: Arial, sans-serif;
}

body {
  display: grid;
  place-items: center;
  text-align: center;
}

/* VOID */

.void {
  width: min(64vw, 520px);
  aspect-ratio: 1;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      #000 22%,
      #12051f 42%,
      #3c0a69 56%,
      transparent 70%
    );

  box-shadow:
    0 0 80px #6f16b8;

  animation:
    pulse 4s ease-in-out infinite;
}

/* TEXT */

.content {
  position: fixed;
  z-index: 2;

  padding: 20px;
}

h1 {
  font-size:
    clamp(42px, 9vw, 100px);

  line-height: .9;

  letter-spacing: -.05em;

  margin: 0;

  text-shadow:
    0 0 30px rgba(130, 40, 255, .4);
}

p {
  opacity: .55;

  margin-top: 18px;

  letter-spacing: .15em;

  font-family: monospace;
}

a {
  display: inline-block;

  margin-top: 25px;

  color: #c590ff;

  text-decoration: none;

  font-family: monospace;

  opacity: .7;

  transition: .2s;
}

a:hover {
  opacity: 1;

  text-shadow:
    0 0 15px #9c52ff;
}

/* ANIMATION */

@keyframes pulse {

  0%,
  100% {
    transform: scale(1);

    filter:
      blur(0);
  }

  50% {
    transform: scale(1.1);

    filter:
      blur(2px);
  }
}
</style>
</head>

<body>

<div class="void"></div>

<div class="content">

  <h1>
    YOU SHOULDN'T<br>
    BE THIS DEEP
  </h1>

  <p>
    VOID NODE // ROUTE 01
  </p>

  <a href="/EndExpanser/secret/">
    &lt; RETURN TO GATE
  </a>

</div>

</body>
</html>
