<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EndExpanser // Secret Gate</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #020104;
  --panel: rgba(8, 5, 15, .74);
  --line: rgba(188, 118, 255, .22);
  --purple: #b979ff;
  --cyan: #7ef9ff;
  --text: #f6efff;
  --muted: rgba(246, 239, 255, .52);
}

html,
body {
  width: 100%;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  position: relative;
}

/* BACKGROUND */

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

.glow {
  position: fixed;
  inset: -30%;

  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(127, 50, 255, .18),
      transparent 35%
    ),
    radial-gradient(
      circle at 65% 65%,
      rgba(55, 220, 255, .06),
      transparent 30%
    );

  filter: blur(40px);

  animation:
    pulse 8s ease-in-out infinite;

  z-index: 1;
  pointer-events: none;
}

.scan {
  position: fixed;
  inset: 0;

  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0 3px,
      rgba(255,255,255,.018) 4px
    );

  pointer-events: none;
  z-index: 10;
}

/* PAGE */

.wrap {
  position: relative;
  z-index: 5;

  width: min(920px, 100%);

  display: grid;
  gap: 18px;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;

  gap: 14px;

  font-size: 11px;
  letter-spacing: .18em;

  color: var(--muted);

  text-transform: uppercase;
}

.dot {
  width: 7px;
  height: 7px;

  background: var(--cyan);

  border-radius: 50%;

  display: inline-block;

  box-shadow:
    0 0 16px var(--cyan);

  margin-right: 8px;
}

.panel {
  border:
    1px solid var(--line);

  background:
    var(--panel);

  backdrop-filter:
    blur(16px);

  border-radius:
    18px;

  padding:
    clamp(22px, 5vw, 42px);

  box-shadow:
    0 20px 80px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.03);
}

.kicker {
  font-size: 11px;
  letter-spacing: .3em;

  color: var(--purple);

  font-weight: 900;

  margin-bottom: 15px;
}

h1 {
  font-size:
    clamp(44px, 10vw, 110px);

  line-height: .83;

  letter-spacing: -.065em;

  text-transform: uppercase;

  font-weight: 950;
}

h1 span {
  color: transparent;

  -webkit-text-stroke:
    1.5px rgba(188,121,255,.9);
}

.lead {
  margin-top: 24px;

  max-width: 620px;

  color: var(--muted);

  font-size: 15px;

  line-height: 1.7;
}

/* TERMINAL */

.terminal {
  margin-top: 28px;

  border:
    1px solid rgba(255,255,255,.08);

  border-radius: 13px;

  background:
    rgba(0,0,0,.34);

  overflow: hidden;
}

.termbar {
  display: flex;
  align-items: center;

  gap: 6px;

  padding:
    10px 12px;

  border-bottom:
    1px solid rgba(255,255,255,.06);

  color:
    rgba(255,255,255,.35);

  font:
    11px/1.2 monospace;
}

.termbar i {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background:
    rgba(255,255,255,.18);
}

.termbody {
  padding: 16px;

  min-height: 150px;

  font:
    13px/1.65
    ui-monospace,
    Consolas,
    monospace;

  color: #d8c6ea;
}

.line {
  opacity: 0;

  transform:
    translateY(5px);

  animation:
    appear .4s forwards;
}

.green {
  color: #9fffc8;
}

.purple {
  color: #c997ff;
}

.cyan {
  color: #7ef9ff;
}

/* BUTTONS */

.puzzle {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 10px;

  margin-top: 24px;
}

.sigil {
  appearance: none;

  border:
    1px solid rgba(188,121,255,.18);

  background:
    rgba(255,255,255,.025);

  color: #dcbcff;

  border-radius: 13px;

  min-height: 92px;

  font-size: 34px;

  cursor: pointer;

  transition: .22s;
}

.sigil:hover {
  transform:
    translateY(-3px);

  border-color:
    rgba(188,121,255,.45);

  box-shadow:
    0 10px 30px
    rgba(126,45,255,.12);
}

.sigil.active {
  background:
    rgba(126,45,255,.14);

  border-color:
    rgba(188,121,255,.6);

  text-shadow:
    0 0 20px var(--purple);
}

.hint {
  margin-top: 14px;

  font-size: 12px;

  color:
    rgba(255,255,255,.34);

  letter-spacing: .08em;
}

/* FOOTER */

.footer {
  display: flex;

  justify-content:
    space-between;

  gap: 10px;

  align-items: center;

  color:
    rgba(255,255,255,.28);

  font-size: 11px;
}

.back {
  color:
    rgba(255,255,255,.45);

  text-decoration: none;
}

.back:hover {
  color: white;
}

/* EFFECTS */

.glitch {
  animation:
    glitch .12s linear 3;
}

@keyframes appear {
  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes pulse {
  50% {
    transform:
      scale(1.07);
  }
}

@keyframes glitch {
  0% {
    transform: translate(0);
  }

  33% {
    transform:
      translate(-4px, 1px);
  }

  66% {
    transform:
      translate(4px, -1px);
  }

  100% {
    transform: translate(0);
  }
}

@media (max-width: 650px) {

  .top,
  .footer {
    font-size: 9px;
  }

  .sigil {
    min-height: 74px;
    font-size: 28px;
  }

  .panel {
    padding: 22px;
  }
}
</style>
</head>

<body>

<canvas id="fx"></canvas>

<div class="glow"></div>
<div class="scan"></div>

<div class="wrap">

  <div class="top">

    <div>
      <span class="dot"></span>
      END EXPANSER // HIDDEN NODE
    </div>

    <div id="status">
      signal unstable
    </div>

  </div>

  <section
    class="panel"
    id="panel"
  >

    <div class="kicker">
      UNAUTHORIZED ACCESS DETECTED
    </div>

    <h1>
      YOU FOUND<br>
      <span>THE SIGNAL</span>
    </h1>

    <p class="lead">
      three hidden routes exist.
      none of their access sequences
      are shown here.
    </p>

    <div class="terminal">

      <div class="termbar">
        <i></i>
        <i></i>
        <i></i>

        &nbsp; void-terminal
      </div>

      <div
        class="termbody"
        id="terminal"
      ></div>

    </div>

    <div class="puzzle">

      <button
        class="sigil"
        data-n="1"
      >
        ◈
      </button>

      <button
        class="sigil"
        data-n="2"
      >
        ⌁
      </button>

      <button
        class="sigil"
        data-n="3"
      >
        ◇
      </button>

    </div>

    <div class="hint">
      sequence required // 4 inputs
    </div>

  </section>

  <div class="footer">

    <div>
      NO INDEX // NO NAV // NO PROMISES
    </div>

    <a
      class="back"
      href="/EndExpanser/"
    >
      return to surface
    </a>

  </div>

</div>

<script>

/* ELEMENTS */

const terminal =
  document.getElementById(
    "terminal"
  )

const statusEl =
  document.getElementById(
    "status"
  )

const panel =
  document.getElementById(
    "panel"
  )

const buttons = [
  ...document.querySelectorAll(
    ".sigil"
  )
]

/* TERMINAL STARTUP */

const lines = [

  '<span class="green">[ok]</span> hidden route discovered',

  '<span class="purple">[scan]</span> checking node map...',

  '<span class="cyan">[signal]</span> three locked destinations detected',

  '<span class="purple">[lock]</span> 4-input sequence required'

]

lines.forEach(
  (text, i) => {

    setTimeout(
      () => {

        const div =
          document.createElement(
            "div"
          )

        div.className =
          "line"

        div.innerHTML =
          "> " + text

        terminal.appendChild(
          div
        )

      },

      350 + i * 520
    )
  }
)

/* ==========================
   SECRET COMBINATIONS
   ========================== */

let entered = []

const secretCodes = {

  "1321":
    "/EndExpanser/secret/void/",

  "2133":
    "/EndExpanser/secret/archive/",

  "3212":
    "/EndExpanser/secret/signal/"

}

/* BUTTON LOGIC */

buttons.forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        const n =
          Number(
            button.dataset.n
          )

        entered.push(n)

        button.classList.add(
          "active"
        )

        setTimeout(
          () =>
            button.classList.remove(
              "active"
            ),
          250
        )

        statusEl.textContent =
          `sequence ${entered.length}/4`

        /* WAIT FOR 4 INPUTS */

        if (
          entered.length === 4
        ) {

          const code =
            entered.join("")

          const destination =
            secretCodes[code]

          /* CORRECT */

          if (destination) {

            statusEl.textContent =
              "ACCESS GRANTED"

            panel.classList.add(
              "glitch"
            )

            const div =
              document.createElement(
                "div"
              )

            div.className =
              "line"

            div.innerHTML =
              '> <span class="green">' +
              '[granted]</span> ' +
              'hidden node discovered'

            terminal.appendChild(
              div
            )

            setTimeout(
              () => {

                location.href =
                  destination

              },

              900
            )

          }

          /* WRONG */

          else {

            statusEl.textContent =
              "SEQUENCE REJECTED"

            const div =
              document.createElement(
                "div"
              )

            div.className =
              "line"

            div.innerHTML =
              '> <span style="color:#ff8fa3">' +
              '[denied]</span> ' +
              'invalid sequence'

            terminal.appendChild(
              div
            )

            panel.classList.add(
              "glitch"
            )

            setTimeout(
              () => {

                panel.classList.remove(
                  "glitch"
                )

                statusEl.textContent =
                  "signal unstable"

              },

              700
            )
          }

          entered = []
        }
      }
    )
  }
)

/* ==========================
   PARTICLE BACKGROUND
   ========================== */

const canvas =
  document.getElementById(
    "fx"
  )

const ctx =
  canvas.getContext(
    "2d"
  )

let particles = []

function resize() {

  const dpr =
    Math.min(
      devicePixelRatio || 1,
      2
    )

  canvas.width =
    innerWidth * dpr

  canvas.height =
    innerHeight * dpr

  canvas.style.width =
    innerWidth + "px"

  canvas.style.height =
    innerHeight + "px"

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  )

  particles =
    Array.from(
      {
        length:
          Math.min(
            140,
            Math.floor(
              innerWidth *
              innerHeight /
              8500
            )
          )
      },

      () => ({

        x:
          Math.random() *
          innerWidth,

        y:
          Math.random() *
          innerHeight,

        r:
          Math.random() *
          1.2 +
          .2,

        a:
          Math.random() *
          .5 +
          .12,

        v:
          Math.random() *
          .12 +
          .02,

        phase:
          Math.random() *
          6.28

      })
    )
}

function draw(time) {

  ctx.clearRect(
    0,
    0,
    innerWidth,
    innerHeight
  )

  for (
    const p
    of particles
  ) {

    p.y -= p.v

    p.x +=
      Math.sin(
        time *
        .0003 +
        p.phase
      ) * .04

    if (
      p.y < -4
    ) {

      p.y =
        innerHeight + 4

      p.x =
        Math.random() *
        innerWidth
    }

    ctx.fillStyle =
      `rgba(
        193,
        136,
        255,
        ${p.a}
      )`

    ctx.beginPath()

    ctx.arc(
      p.x,
      p.y,
      p.r,
      0,
      Math.PI * 2
    )

    ctx.fill()
  }

  requestAnimationFrame(
    draw
  )
}

resize()

addEventListener(
  "resize",
  resize
)

requestAnimationFrame(
  draw
)

</script>

</body>
</html>
