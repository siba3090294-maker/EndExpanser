<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SIGNAL NODE</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;

  background: #010406;
  color: #90fff3;

  font-family:
    ui-monospace,
    SFMono-Regular,
    Consolas,
    monospace;

  overflow: hidden;
}

body {
  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 24px;

  background:
    radial-gradient(
      circle at center,
      rgba(0,255,220,.055),
      transparent 45%
    ),
    #010406;
}

/* SCANLINES */

.scanlines {
  position: fixed;
  inset: 0;

  pointer-events: none;

  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0 3px,
      rgba(100,255,240,.018) 4px
    );

  z-index: 10;
}

/* MAIN BOX */

.box {
  position: relative;

  width: min(900px, 100%);

  border:
    1px solid #1e665f;

  padding:
    clamp(20px, 5vw, 38px);

  background:
    rgba(0,255,220,.025);

  box-shadow:
    0 0 80px
    rgba(0,255,220,.04);
}

.status {
  font-size: 11px;

  letter-spacing: .2em;

  opacity: .45;

  margin-bottom: 16px;
}

h1 {
  font-size:
    clamp(38px, 8vw, 80px);

  line-height: .9;

  letter-spacing: -.05em;

  margin:
    0 0 12px;

  text-shadow:
    0 0 25px
    rgba(100,255,240,.25);
}

.message {
  min-height: 24px;

  opacity: .7;

  font-size: 13px;

  letter-spacing: .08em;
}

/* SIGNAL WAVE */

.wave {
  height: 170px;

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 4px;

  margin:
    28px 0;

  overflow: hidden;

  border-top:
    1px solid rgba(100,255,240,.1);

  border-bottom:
    1px solid rgba(100,255,240,.1);
}

.wave i {
  display: block;

  width: 3px;

  min-height: 4px;

  background:
    #77ffef;

  box-shadow:
    0 0 10px #77ffef;

  animation:
    wave 1.4s ease-in-out infinite;
}

/* TERMINAL */

.terminal {
  border:
    1px solid rgba(100,255,240,.15);

  background:
    rgba(0,0,0,.3);

  padding: 15px;

  min-height: 120px;

  color:
    rgba(160,255,245,.7);

  font-size: 12px;

  line-height: 1.7;
}

.line {
  opacity: 0;

  animation:
    appear .35s forwards;
}

.good {
  color: #a8ffcf;
}

.warn {
  color: #ffcb7e;
}

/* FINAL TRANSMISSION */

.transmission {
  display: none;

  margin-top: 22px;

  border:
    1px solid rgba(120,255,240,.3);

  padding: 18px;

  background:
    rgba(80,255,230,.04);

  animation:
    reveal .6s ease both;
}

.transmission.open {
  display: block;
}

.transmission small {
  display: block;

  opacity: .4;

  letter-spacing: .2em;

  margin-bottom: 10px;
}

.transmission strong {
  font-size:
    clamp(18px, 4vw, 28px);

  letter-spacing: .08em;

  color: #cafff8;

  text-shadow:
    0 0 15px
    rgba(100,255,240,.3);
}

/* BACK */

.back {
  display: inline-block;

  margin-top: 25px;

  color: #b6fff8;

  text-decoration: none;

  opacity: .5;

  transition: .2s;
}

.back:hover {
  opacity: 1;

  text-shadow:
    0 0 12px #70fff0;
}

/* ANIMATIONS */

@keyframes wave {

  0%,
  100% {
    transform:
      scaleY(.15);

    opacity: .35;
  }

  50% {
    transform:
      scaleY(1);

    opacity: 1;
  }
}

@keyframes appear {
  to {
    opacity: 1;
  }
}

@keyframes reveal {

  from {
    opacity: 0;

    transform:
      translateY(10px);

    filter:
      blur(5px);
  }

  to {
    opacity: 1;

    transform:
      translateY(0);

    filter:
      blur(0);
  }
}

@keyframes glitch {

  0% {
    transform:
      translate(0);
  }

  25% {
    transform:
      translate(-3px, 1px);
  }

  50% {
    transform:
      translate(3px, -1px);
  }

  75% {
    transform:
      translate(-2px, -1px);
  }

  100% {
    transform:
      translate(0);
  }
}

.glitch {
  animation:
    glitch .1s linear 5;
}

@media (max-width: 600px) {

  .wave {
    gap: 2px;
    height: 130px;
  }

  .wave i {
    width: 2px;
  }

  .box {
    padding: 20px;
  }
}
</style>
</head>

<body>

<div class="scanlines"></div>

<div
  class="box"
  id="box"
>

  <div class="status">
    END EXPANSER //
    RECEIVER NODE 03
  </div>

  <h1>
    SIGNAL<br>
    LOCKED
  </h1>

  <div
    class="message"
    id="message"
  >
    DECODING TRANSMISSION...
  </div>

  <div
    class="wave"
    id="wave"
  ></div>

  <div
    class="terminal"
    id="terminal"
  ></div>

  <div
    class="transmission"
    id="transmission"
  >

    <small>
      TRANSMISSION RECOVERED
    </small>

    <strong>
      KEEP EXPANDING.
      THE END IS NOT THE END.
    </strong>

  </div>

  <a
    class="back"
    href="/EndExpanser/secret/"
  >
    &lt; RETURN TO GATE
  </a>

</div>

<script>

/* SIGNAL BARS */

const wave =
  document.getElementById(
    "wave"
  )

for (
  let i = 0;
  i < 90;
  i++
) {

  const bar =
    document.createElement(
      "i"
    )

  bar.style.height =
    (
      10 +
      Math.random() * 130
    ) +
    "px"

  bar.style.animationDelay =
    (
      Math.random() *
      1.4
    ) +
    "s"

  bar.style.animationDuration =
    (
      .7 +
      Math.random() *
      1.3
    ) +
    "s"

  wave.appendChild(
    bar
  )
}

/* TERMINAL */

const terminal =
  document.getElementById(
    "terminal"
  )

const message =
  document.getElementById(
    "message"
  )

const transmission =
  document.getElementById(
    "transmission"
  )

const box =
  document.getElementById(
    "box"
  )

const lines = [

  "[receiver] frequency acquired",

  "[scan] searching transmission fragments...",

  "[packet] 03-A recovered",

  "[packet] 03-B recovered",

  "[warning] unknown carrier detected",

  "[decode] rebuilding message...",

  "[decode] 37%",

  "[decode] 68%",

  "[decode] 94%",

  "[decode] 100%"

]

lines.forEach(
  (text, index) => {

    setTimeout(
      () => {

        const line =
          document.createElement(
            "div"
          )

        line.className =
          "line"

        if (
          text.includes(
            "warning"
          )
        ) {

          line.classList.add(
            "warn"
          )
        }

        if (
          text.includes(
            "100%"
          )
        ) {

          line.classList.add(
            "good"
          )
        }

        line.textContent =
          "> " + text

        terminal.appendChild(
          line
        )

      },

      350 +
      index * 330
    )
  }
)

/* FINAL MESSAGE */

setTimeout(
  () => {

    message.textContent =
      "TRANSMISSION DECODED"

    box.classList.add(
      "glitch"
    )

    setTimeout(
      () => {

        box.classList.remove(
          "glitch"
        )

        transmission.classList.add(
          "open"
        )

      },

      600
    )

  },

  3900
)

</script>

</body>
</html>
